AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Tatkal payment-booking consistency project (core stack, v5 - with the backoff recheck experiment).
  DynamoDB tables, mock payment gateway, NAIVE flow, Step Functions SAGA, reconciler,
  dead-letter queue + alarms, dashboard, batch runner. Delete the stack to remove everything.

Parameters:
  HoldSeconds:
    Type: Number
    Default: 120
    Description: How long a seat hold lasts before it expires (DynamoDB TTL attribute holdExpiresAt)
  ReconcilerMode:
    Type: String
    Default: SCAN
    AllowedValues: [SCAN, BACKOFF]
    Description: >
      Who follows up on a payment whose result is unknown. SCAN = one reconciler sweeps every minute (baseline).
      BACKOFF = each such payment gets its own recheck workflow that waits 2, 4, 8, 16, 32, 64 seconds between bank checks.

Conditions:
  IsScan: !Equals [!Ref ReconcilerMode, SCAN]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tags:
      project: tatkal
    Environment:
      Variables:
        SEATS_TABLE: !Ref SeatsTable
        PAYMENTS_TABLE: !Ref PaymentsTable
        BOOKINGS_TABLE: !Ref BookingsTable
        EVENTS_TABLE: !Ref EventsTable
        ORDERS_TABLE: !Ref OrdersTable
        HOLD_SECONDS: !Ref HoldSeconds
        RECON_MODE: !Ref ReconcilerMode

Resources:
  # ------------------------------------------------------------------ data
  # Seats: one item per seat. holdExpiresAt is the TTL attribute (epoch seconds).
  SeatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tatkal-seats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: seatId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: seatId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: holdExpiresAt
        Enabled: true
      Tags:
        - Key: project
          Value: tatkal

  # Payments: the mock gateway's own ledger (where money was "debited").
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tatkal-payments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH
      Tags:
        - Key: project
          Value: tatkal

  # Bookings: issued tickets.
  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tatkal-bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      Tags:
        - Key: project
          Value: tatkal

  # Events: step-by-step log per transaction, used for the UI timeline.
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tatkal-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: txnId
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: txnId
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      Tags:
        - Key: project
          Value: tatkal

  # Orders: the saga's own record per idempotency key (HELD, PAID, PAYMENT_UNKNOWN, CONFIRMED, REFUNDED ...).
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tatkal-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      Tags:
        - Key: project
          Value: tatkal

  # Dead-letter queue: orders that still fail after all retries wait here for a human.
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: tatkal-dlq
      MessageRetentionPeriod: 345600
      Tags:
        - Key: project
          Value: tatkal

  # ------------------------------------------------------------ mock gateway
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-gateway
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: default
      InlineCode: |
        import json, os, time, zlib, boto3
        from botocore.exceptions import ClientError

        pay = boto3.resource("dynamodb").Table(os.environ["PAYMENTS_TABLE"])
        bus = boto3.client("events")


        def handler(event, context):
            """Mock payment gateway. action = charge (default) | status | refund."""
            action = event.get("action", "charge")
            pid = event["paymentId"]
            old = pay.get_item(Key={"paymentId": pid}).get("Item")

            if action == "status":
                if not old:
                    return {"paymentId": pid, "status": "NOT_FOUND"}
                pay.update_item(Key={"paymentId": pid}, UpdateExpression="ADD statusChecks :one",
                                ExpressionAttributeValues={":one": 1})  # counts every call to the bank
                if time.time() < int(old.get("settleAt", 0)):  # a real bank needs a few seconds to settle
                    return {"paymentId": pid, "status": "PENDING"}
                return {"paymentId": pid, "status": old["status"]}

            if action == "refund":
                if event.get("failRefund"):
                    raise RuntimeError("refund endpoint unavailable")
                if not old or old["status"] != "CAPTURED":
                    return {"paymentId": pid, "status": old["status"] if old else "NOT_FOUND"}
                pay.update_item(
                    Key={"paymentId": pid},
                    UpdateExpression="SET #s = :r",
                    ExpressionAttributeNames={"#s": "status"},
                    ExpressionAttributeValues={":r": "REFUNDED"},
                )
                # EventBridge PutEvents is a management event, so CloudTrail records every refund.
                bus.put_events(Entries=[{
                    "Source": "tatkal.gateway", "DetailType": "RefundIssued",
                    "Detail": json.dumps({"paymentId": pid, "txnId": old["txnId"], "amount": int(old["amount"])}),
                }])
                return {"paymentId": pid, "status": "REFUNDED"}

            mode = event.get("mode", "SUCCESS")
            if old:  # idempotent replay: the same paymentId is never charged twice
                s = "SUCCESS" if old["status"] == "CAPTURED" else old["status"]
                return {"paymentId": pid, "status": s, "replayed": True}

            status = "DECLINED" if mode == "DECLINE" else "CAPTURED"
            now = int(time.time())
            settle = now + 2 + zlib.crc32(pid.encode()) % 29 if mode == "TIMEOUT_BUT_CHARGED" else 0  # 2-30 s
            try:
                pay.put_item(
                    Item={
                        "paymentId": pid,
                        "txnId": event["txnId"],
                        "amount": int(event.get("amount", 500)),
                        "status": status,
                        "mode": mode,
                        "createdAt": now,
                        "settleAt": settle,
                    },
                    ConditionExpression="attribute_not_exists(paymentId)",
                )
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise
                return {"paymentId": pid, "status": "SUCCESS", "replayed": True}

            if mode == "TIMEOUT_BUT_CHARGED":
                return {"paymentId": pid, "status": "TIMEOUT"}  # money taken, caller never hears back
            return {"paymentId": pid, "status": "SUCCESS" if status == "CAPTURED" else "DECLINED"}

  # ------------------------------------------------------------- naive flow
  NaiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-naive
      Handler: index.handler
      Timeout: 30
      # Public URL used instead of API Gateway. Try: <url>?mode=TIMEOUT_BUT_CHARGED
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET']
      Environment:
        Variables:
          GATEWAY_FN: !Ref GatewayFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref GatewayFunction
      InlineCode: |
        import json, os, uuid, datetime, boto3
        from botocore.exceptions import ClientError

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        bookings = ddb.Table(os.environ["BOOKINGS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])
        lam = boto3.client("lambda")


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "NAIVE", "step": step, "message": msg})


        def charge(txn, mode):
            pid = "pay-" + uuid.uuid4().hex[:10]  # naive: a brand-new payment id on every attempt
            body = {"paymentId": pid, "txnId": txn, "amount": 500, "mode": mode}
            r = lam.invoke(FunctionName=os.environ["GATEWAY_FN"], Payload=json.dumps(body))
            return json.loads(r["Payload"].read())


        def handler(event, context):
            """Works from console tests ({"mode": ...}) and from the function URL (?mode=...)."""
            via_url = "requestContext" in event
            if via_url:
                if event.get("rawPath", "/") != "/":  # ignore /favicon.ico and other stray browser requests
                    return {"statusCode": 404, "body": ""}
                event = event.get("queryStringParameters") or {}
            out = run(event)
            if not via_url:
                return out
            return {"statusCode": 200, "headers": {"Content-Type": "application/json"}, "body": json.dumps(out)}


        def run(event):
            """NAIVE flow: charge first, then book. Nothing repairs a failure in between.
            mode = SUCCESS | DECLINE | TIMEOUT_BUT_CHARGED | BOOKING_FAILS_AFTER_PAY
                   | DUPLICATE_CLICK | HOLD_EXPIRES_DURING_PAYMENT"""
            txn = event.get("txnId") or "txn-" + uuid.uuid4().hex[:8]
            eid = event.get("eventId", "E1")
            sid = event.get("seatId") or "S-" + uuid.uuid4().hex[:6]
            mode = event.get("mode", "SUCCESS")

            log(txn, "START", "naive flow, mode=%s: charge first, then book" % mode)
            clicks = 2 if mode == "DUPLICATE_CLICK" else 1
            pay = None
            for i in range(clicks):
                pay = charge(txn, mode)
                log(txn, "CHARGE", "click %d -> gateway says %s" % (i + 1, pay["status"]))

            if pay["status"] != "SUCCESS":
                log(txn, "END", "user is shown: payment failed, please retry")
                return {"txnId": txn, "outcome": "PAYMENT_FAILED_SHOWN", "gateway": pay["status"]}

            try:
                if mode in ("BOOKING_FAILS_AFTER_PAY", "BOOKING_AND_REFUND_FAIL"):
                    raise RuntimeError("booking service error")
                if mode == "HOLD_EXPIRES_DURING_PAYMENT":  # someone else took the seat while we paid
                    seats.put_item(Item={"eventId": eid, "seatId": sid, "txnId": "someone-else"})
                seats.put_item(
                    Item={"eventId": eid, "seatId": sid, "txnId": txn},
                    ConditionExpression="attribute_not_exists(seatId)",
                )
                bookings.put_item(
                    Item={"bookingId": "bk-" + uuid.uuid4().hex[:8], "txnId": txn,
                          "paymentId": pay["paymentId"], "seatId": sid}
                )
                log(txn, "BOOKED", "ticket issued")
                return {"txnId": txn, "outcome": "BOOKED"}
            except (RuntimeError, ClientError) as e:
                log(txn, "BOOK_FAILED", "%s - money already taken, no refund, no retry" % e)
                return {"txnId": txn, "outcome": "PAID_NOT_BOOKED"}

  # --------------------------------------------------------------- the saga
  SagaReserveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-reserve
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      InlineCode: |
        import os, time, datetime, boto3
        from botocore.exceptions import ClientError

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "SAGA", "step": step, "message": msg})


        def handler(event, context):
            """Saga step 1 - RESERVE. Idempotent on orderKey; holds the seat with a TTL before any payment."""
            ctx = event["ctx"]
            key, eid, sid = ctx["orderKey"], ctx["eventId"], ctx["seatId"]
            now = int(time.time())
            try:
                orders.put_item(
                    Item={"orderId": key, "status": "HELD", "eventId": eid, "seatId": sid,
                          "mode": ctx["mode"], "createdAt": now, "updatedAt": now, "attempts": 0},
                    ConditionExpression="attribute_not_exists(orderId)",
                )
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise
                old = orders.get_item(Key={"orderId": key}).get("Item", {})
                log(key, "DUPLICATE_IGNORED",
                    "same idempotency key again (order is %s): no second hold, no second charge" % old.get("status"))
                return {**ctx, "stage": "DUPLICATE"}
            try:
                seats.put_item(
                    Item={"eventId": eid, "seatId": sid, "txnId": key, "status": "HELD",
                          "holdExpiresAt": now + int(os.environ["HOLD_SECONDS"])},
                    ConditionExpression="attribute_not_exists(seatId) OR (attribute_exists(holdExpiresAt) AND holdExpiresAt < :now)",
                    ExpressionAttributeValues={":now": now},
                )
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise
                orders.update_item(Key={"orderId": key}, UpdateExpression="SET #s = :s, updatedAt = :t",
                                   ExpressionAttributeNames={"#s": "status"},
                                   ExpressionAttributeValues={":s": "SEAT_TAKEN", ":t": now})
                log(key, "SEAT_TAKEN", "seat already held or booked: nothing was charged")
                return {**ctx, "stage": "SEAT_TAKEN"}
            log(key, "RESERVED", "seat held for %ss before any payment (conditional write + TTL)" % os.environ["HOLD_SECONDS"])
            return {**ctx, "stage": "RESERVED"}

  SagaPayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-pay
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          GATEWAY_FN: !Ref GatewayFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref GatewayFunction
      InlineCode: |
        import json, os, time, datetime, boto3

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])
        lam = boto3.client("lambda")


        class TransientError(Exception):
            pass


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "SAGA", "step": step, "message": msg})


        def handler(event, context):
            """Saga step 2 - PAY. The payment id is derived from the order key, so a retry or a
            double click can never create a second charge."""
            ctx = event["ctx"]
            key, mode = ctx["orderKey"], ctx["mode"]
            pid = "pay-" + key
            seat = {"eventId": ctx["eventId"], "seatId": ctx["seatId"]}
            now = int(time.time())

            if mode == "HOLD_EXPIRES_DURING_PAYMENT":  # the payment page was slow: the hold ran out meanwhile
                seats.update_item(Key=seat, UpdateExpression="SET holdExpiresAt = :p",
                                  ExpressionAttributeValues={":p": now - 1})
                log(key, "HOLD_EXPIRED", "payment took too long: the seat hold ran out while paying")

            try:  # "Rate Exceeded" must become a retryable error, not a dead-letter message
                r = lam.invoke(FunctionName=os.environ["GATEWAY_FN"],
                               Payload=json.dumps({"paymentId": pid, "txnId": key, "amount": 500, "mode": mode}))
            except Exception as e:
                raise TransientError("gateway not reachable: %s" % e)
            body = json.loads(r["Payload"].read())
            if r.get("FunctionError"):
                raise TransientError("gateway error: %s" % body.get("errorMessage"))

            status = {"SUCCESS": "PAID", "DECLINED": "DECLINED", "TIMEOUT": "PAYMENT_UNKNOWN"}[body["status"]]
            orders.update_item(Key={"orderId": key}, UpdateExpression="SET #s = :s, paymentId = :p, updatedAt = :t",
                               ExpressionAttributeNames={"#s": "status"},
                               ExpressionAttributeValues={":s": status, ":p": pid, ":t": now})
            log(key, "PAY", "gateway says %s -> order %s" % (body["status"], status))
            out = {**ctx, "paymentId": pid, "payStatus": body["status"]}
            if body["status"] == "TIMEOUT":  # keep the seat while the reconciler finds out the truth
                seats.update_item(Key=seat, UpdateExpression="SET holdExpiresAt = :p",
                                  ExpressionAttributeValues={":p": now + 600})
                log(key, "PENDING", "no reply from the gateway: order parked for the reconciler, hold extended")
                out["stage"] = "PENDING_RECONCILE"
            return out

  SagaConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-confirm
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      InlineCode: |
        import os, time, datetime, boto3
        from botocore.exceptions import ClientError

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        bookings = ddb.Table(os.environ["BOOKINGS_TABLE"])
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])


        class BookingFailed(Exception):
            pass


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "SAGA", "step": step, "message": msg})


        def handler(event, context):
            """Saga step 3 - CONFIRM. Turns the hold into a booking. Failing here triggers the refund branch."""
            ctx = event["ctx"]
            key = ctx["orderKey"]
            now = int(time.time())
            if ctx["mode"] in ("BOOKING_FAILS_AFTER_PAY", "BOOKING_AND_REFUND_FAIL"):
                log(key, "CONFIRM_FAILED", "booking service error after payment: compensation starts")
                raise BookingFailed("booking service error")
            try:
                seats.update_item(
                    Key={"eventId": ctx["eventId"], "seatId": ctx["seatId"]},
                    UpdateExpression="SET #s = :b REMOVE holdExpiresAt",
                    ConditionExpression="txnId = :me AND (holdExpiresAt >= :now OR #s = :b)",
                    ExpressionAttributeNames={"#s": "status"},
                    ExpressionAttributeValues={":b": "BOOKED", ":me": key, ":now": now},
                )
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise
                log(key, "CONFIRM_FAILED", "the hold expired before confirmation: compensation starts")
                raise BookingFailed("hold expired")
            try:
                bookings.put_item(
                    Item={"bookingId": "bk-" + key, "txnId": key, "paymentId": ctx["paymentId"], "seatId": ctx["seatId"]},
                    ConditionExpression="attribute_not_exists(bookingId)",
                )
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise  # already booked by an earlier attempt: fine, confirm is idempotent
            orders.update_item(Key={"orderId": key}, UpdateExpression="SET #s = :s, updatedAt = :t",
                               ExpressionAttributeNames={"#s": "status"}, ExpressionAttributeValues={":s": "CONFIRMED", ":t": now})
            log(key, "BOOKED", "seat confirmed, ticket issued")
            return {**ctx, "stage": "BOOKED"}

  SagaRefundFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-refund
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          GATEWAY_FN: !Ref GatewayFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref GatewayFunction
      InlineCode: |
        import json, os, time, datetime, boto3

        ddb = boto3.resource("dynamodb")
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])
        lam = boto3.client("lambda")


        class RefundFailed(Exception):
            pass


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "SAGA", "step": step, "message": msg})


        def handler(event, context):
            """Compensation - REFUND the captured payment because the booking could not be completed."""
            ctx = event["ctx"]
            key = ctx["orderKey"]
            try:  # "Rate Exceeded" is a refund failure the workflow retries, not a dead-letter message
                r = lam.invoke(FunctionName=os.environ["GATEWAY_FN"],
                               Payload=json.dumps({"action": "refund", "paymentId": ctx["paymentId"],
                                                   "failRefund": ctx["mode"] == "BOOKING_AND_REFUND_FAIL"}))
            except Exception as e:
                raise RefundFailed("gateway not reachable: %s" % e)
            body = json.loads(r["Payload"].read())
            if r.get("FunctionError"):
                log(key, "REFUND_FAILED", "refund call failed: %s" % body.get("errorMessage"))
                raise RefundFailed(str(body.get("errorMessage")))
            orders.update_item(Key={"orderId": key}, UpdateExpression="SET #s = :s, updatedAt = :t",
                               ExpressionAttributeNames={"#s": "status"},
                               ExpressionAttributeValues={":s": "REFUNDED", ":t": int(time.time())})
            log(key, "REFUNDED", "payment refunded automatically (%s)" % body["status"])
            return {**ctx, "refundStatus": body["status"]}

  SagaReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-release
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      InlineCode: |
        import os, time, datetime, boto3
        from botocore.exceptions import ClientError

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "SAGA", "step": step, "message": msg})


        def handler(event, context):
            """Compensation - RELEASE the seat hold and close the order (final = DECLINED or REFUNDED)."""
            ctx, final = event["ctx"], event["final"]
            key = ctx["orderKey"]
            try:
                seats.delete_item(Key={"eventId": ctx["eventId"], "seatId": ctx["seatId"]},
                                  ConditionExpression="txnId = :me", ExpressionAttributeValues={":me": key})
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise  # the seat is no longer ours: nothing to release
            orders.update_item(Key={"orderId": key}, UpdateExpression="SET #s = :s, updatedAt = :t",
                               ExpressionAttributeNames={"#s": "status"},
                               ExpressionAttributeValues={":s": final, ":t": int(time.time())})
            log(key, "RELEASED", "seat hold released, order closed as %s" % final)
            return {**ctx, "stage": final}

  # Standard workflow: you can open each execution and see the graph (screenshots).
  SagaStandardMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: tatkal-saga
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SagaReserveFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SagaPayFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SagaConfirmFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SagaRefundFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SagaReleaseFunction
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref RecheckMachine
      DefinitionSubstitutions:
        ReserveFn: !GetAtt SagaReserveFunction.Arn
        PayFn: !GetAtt SagaPayFunction.Arn
        ConfirmFn: !GetAtt SagaConfirmFunction.Arn
        RefundFn: !GetAtt SagaRefundFunction.Arn
        ReleaseFn: !GetAtt SagaReleaseFunction.Arn
        DlqUrl: !Ref DeadLetterQueue
        ReconMode: !Ref ReconcilerMode
        RecheckSm: !Ref RecheckMachine
      Definition:
        Comment: Tatkal booking saga - Reserve, Pay, Confirm, with compensation (refund, release) and a dead-letter queue
        StartAt: Reserve
        States:
          Reserve:
            Type: Task
            Resource: ${ReserveFn}
            Parameters:
              ctx.$: $
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: ToDLQ
            Next: ReserveResult

          ReserveResult:
            Type: Choice
            Choices:
              - Variable: $.stage
                StringEquals: DUPLICATE
                Next: DuplicateIgnored
              - Variable: $.stage
                StringEquals: SEAT_TAKEN
                Next: SeatTaken
            Default: Pay

          Pay:
            Type: Task
            Resource: ${PayFn}
            Parameters:
              ctx.$: $
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
              - ErrorEquals: [TransientError]
                IntervalSeconds: 2
                MaxAttempts: 6
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: ToDLQ
            Next: PayResult

          PayResult:
            Type: Choice
            Choices:
              - Variable: $.payStatus
                StringEquals: SUCCESS
                Next: Confirm
              - Variable: $.payStatus
                StringEquals: DECLINED
                Next: ReleaseDeclined
              - Variable: $.payStatus
                StringEquals: TIMEOUT
                Next: ReadMode
            Default: ToDLQ

          # The stack setting ReconcilerMode decides who follows up on an unclear payment:
          # SCAN = the once-a-minute reconciler picks it up; BACKOFF = its own recheck workflow starts now.
          ReadMode:
            Type: Pass
            Result: ${ReconMode}
            ResultPath: $.reconMode
            Next: ModeChoice

          ModeChoice:
            Type: Choice
            Choices:
              - Variable: $.reconMode
                StringEquals: BACKOFF
                Next: StartRecheck
            Default: PendingReconcile

          StartRecheck:
            Type: Task
            Resource: arn:aws:states:::states:startExecution
            Parameters:
              StateMachineArn: ${RecheckSm}
              Input:
                orderKey.$: $.orderKey
            ResultPath: null
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: ToDLQ
            Next: PendingReconcile

          Confirm:
            Type: Task
            Resource: ${ConfirmFn}
            Parameters:
              ctx.$: $
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Refund
            Next: Booked

          Refund:
            Type: Task
            Resource: ${RefundFn}
            Parameters:
              ctx.$: $
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
              - ErrorEquals: [RefundFailed]
                IntervalSeconds: 1
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: ToDLQ
            ResultPath: $
            Next: ReleaseRefunded

          ReleaseRefunded:
            Type: Task
            Resource: ${ReleaseFn}
            Parameters:
              ctx.$: $
              final: REFUNDED
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
            Next: Refunded

          ReleaseDeclined:
            Type: Task
            Resource: ${ReleaseFn}
            Parameters:
              ctx.$: $
              final: DECLINED
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 1
                MaxAttempts: 5
                BackoffRate: 2
            Next: Declined

          ToDLQ:
            Type: Task
            Resource: arn:aws:states:::sqs:sendMessage
            Parameters:
              QueueUrl: ${DlqUrl}
              MessageBody.$: States.JsonToString($)
            ResultPath: null
            Next: NeedsManualReview

          NeedsManualReview:
            Type: Fail
            Error: NeedsManualReview
            Cause: Compensation failed after retries; the order was sent to the dead-letter queue

          Booked:
            Type: Succeed
          Refunded:
            Type: Succeed
          Declined:
            Type: Succeed
          PendingReconcile:
            Type: Succeed
          DuplicateIgnored:
            Type: Succeed
          SeatTaken:
            Type: Succeed

