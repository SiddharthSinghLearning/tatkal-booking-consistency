  # Novelty: one small workflow per unclear payment. It waits, asks the bank, waits twice as long, asks again.
  # Used only when ReconcilerMode = BACKOFF (the saga starts it); in SCAN mode it is never started.
  RecheckMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: tatkal-recheck
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ReconcilerFunction
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName
      DefinitionSubstitutions:
        ReconcilerFn: !GetAtt ReconcilerFunction.Arn
        DlqUrl: !Ref DeadLetterQueue
      Definition:
        Comment: Per-payment recheck with exponential backoff. Wait a little, ask the bank, wait twice as long, ask again.
        StartAt: Wait1
        States:
          Wait1:
            Type: Wait
            Seconds: 2
            Next: Check1

          Check1:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Wait2
            Next: Done1

          Done1:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: Wait2

          Wait2:
            Type: Wait
            Seconds: 4
            Next: Check2

          Check2:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Wait3
            Next: Done2

          Done2:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: Wait3

          Wait3:
            Type: Wait
            Seconds: 8
            Next: Check3

          Check3:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Wait4
            Next: Done3

          Done3:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: Wait4

          Wait4:
            Type: Wait
            Seconds: 16
            Next: Check4

          Check4:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Wait5
            Next: Done4

          Done4:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: Wait5

          Wait5:
            Type: Wait
            Seconds: 32
            Next: Check5

          Check5:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Wait6
            Next: Done5

          Done5:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: Wait6

          Wait6:
            Type: Wait
            Seconds: 64
            Next: Check6

          Check6:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${ReconcilerFn}
              Payload:
                orderId.$: $.orderKey
            ResultSelector:
              open.$: $.Payload.open
            ResultPath: $.check
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 4
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: GiveUp
            Next: Done6

          Done6:
            Type: Choice
            Choices:
              - Variable: $.check.open
                NumericEquals: 0
                Next: Resolved
            Default: GiveUp

          GiveUp:
            Type: Task
            Resource: arn:aws:states:::sqs:sendMessage
            Parameters:
              QueueUrl: ${DlqUrl}
              MessageBody.$: States.JsonToString($)
            ResultPath: null
            Next: NeedsManualReview

          NeedsManualReview:
            Type: Fail
            Error: NeedsManualReview
            Cause: The bank never settled this payment within the recheck schedule; a human must look at it

          Resolved:
            Type: Succeed

  SagaStartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-saga-start
      Handler: index.handler
      Timeout: 60
      # Public URL. Try: <url>?mode=TIMEOUT_BUT_CHARGED   (add &std=1 to watch the graph in the console)
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET']
      Environment:
        Variables:
          EXPRESS_SM: !Ref SagaExpressMachine
          STANDARD_SM: !Ref SagaStandardMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:StartSyncExecution
              Resource: !Ref SagaExpressMachine
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref SagaStandardMachine
      InlineCode: |
        import json, os, uuid, boto3
        from concurrent.futures import ThreadPoolExecutor

        sfn = boto3.client("stepfunctions")


        def start(inp, standard):
            if standard:  # asynchronous: watch the execution graph in the Step Functions console
                r = sfn.start_execution(stateMachineArn=os.environ["STANDARD_SM"],
                                        name=inp["orderKey"] + "-" + uuid.uuid4().hex[:6], input=json.dumps(inp))
                return {"status": "STARTED", "executionArn": r["executionArn"]}
            r = sfn.start_sync_execution(stateMachineArn=os.environ["EXPRESS_SM"], input=json.dumps(inp))
            out = json.loads(r["output"]) if r.get("output") else {}
            return {"status": r["status"], "stage": out.get("stage") or r.get("error", "FAILED")}


        def handler(event, context):
            """Starts the saga. Works from console tests ({"mode": ...}) and from the function URL (?mode=...&std=1).
            DUPLICATE_CLICK starts the same order twice at the same moment, like a double click."""
            via_url = "requestContext" in event
            if via_url:
                if event.get("rawPath", "/") != "/":
                    return {"statusCode": 404, "body": ""}
                event = event.get("queryStringParameters") or {}
            mode = event.get("mode", "SUCCESS")
            inp = {"orderKey": event.get("key") or "sg-" + uuid.uuid4().hex[:8],
                   "eventId": event.get("eventId", "E1"),
                   "seatId": event.get("seatId") or "S-" + uuid.uuid4().hex[:6], "mode": mode}
            standard = str(event.get("std", "")).lower() in ("1", "true")
            clicks = 2 if mode == "DUPLICATE_CLICK" else 1
            with ThreadPoolExecutor(clicks) as ex:
                res = list(ex.map(lambda _: start(inp, standard), range(clicks)))
            main = next((r for r in res if r.get("stage") != "DUPLICATE"), res[0])
            out = {"orderKey": inp["orderKey"], "outcome": main.get("stage") or main["status"], "executions": res}
            if not via_url:
                return out
            return {"statusCode": 200, "headers": {"Content-Type": "application/json"}, "body": json.dumps(out)}

  # ------------------------------------------------------------- reconciler
  ReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-reconciler
      Handler: index.handler
      Timeout: 60
      Environment:
        Variables:
          GATEWAY_FN: !Ref GatewayFunction
          DLQ_URL: !Ref DeadLetterQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref GatewayFunction
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            State: !If [IsScan, ENABLED, DISABLED]
      InlineCode: |
        import json, os, time, datetime, boto3
        from botocore.exceptions import ClientError
        from boto3.dynamodb.conditions import Attr

        ddb = boto3.resource("dynamodb")
        seats = ddb.Table(os.environ["SEATS_TABLE"])
        orders = ddb.Table(os.environ["ORDERS_TABLE"])
        bookings = ddb.Table(os.environ["BOOKINGS_TABLE"])
        events = ddb.Table(os.environ["EVENTS_TABLE"])
        lam = boto3.client("lambda")
        sqs = boto3.client("sqs")
        MAX_ATTEMPTS = 5


        def log(txn, step, msg):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            events.put_item(Item={"txnId": txn, "ts": now, "flow": "RECONCILER", "step": step, "message": msg})


        def gateway(body):
            r = lam.invoke(FunctionName=os.environ["GATEWAY_FN"], Payload=json.dumps(body))
            out = json.loads(r["Payload"].read())
            if r.get("FunctionError"):
                raise RuntimeError(out.get("errorMessage"))
            return out


        def close(o, status, now, note):
            orders.update_item(Key={"orderId": o["orderId"]},
                               UpdateExpression="SET #s = :s, updatedAt = :t, resolveSecs = :r",
                               ExpressionAttributeNames={"#s": "status"},
                               ExpressionAttributeValues={":s": status, ":t": now, ":r": now - int(o["updatedAt"])})
            log(o["orderId"], status, note)


        def put(table, **kw):
            try:
                table.put_item(**kw)
                return True
            except ClientError as e:
                if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                    raise
                return False


        def take_seat(o, now):
            return put(seats, Item={"eventId": o["eventId"], "seatId": o["seatId"], "txnId": o["orderId"], "status": "BOOKED"},
                       ConditionExpression="attribute_not_exists(seatId) OR txnId = :me OR "
                                           "(attribute_exists(holdExpiresAt) AND holdExpiresAt < :now)",
                       ExpressionAttributeValues={":me": o["orderId"], ":now": now})


        def resolve(o, now):
            pid = o.get("paymentId") or "pay-" + o["orderId"]
            st = gateway({"action": "status", "paymentId": pid})["status"]
            if st == "CAPTURED":
                if take_seat(o, now):
                    put(bookings, Item={"bookingId": "bk-" + o["orderId"], "txnId": o["orderId"],
                                        "paymentId": pid, "seatId": o["seatId"]},
                        ConditionExpression="attribute_not_exists(bookingId)")
                    close(o, "CONFIRMED", now, "money was taken: seat booked after the fact")
                else:
                    gateway({"action": "refund", "paymentId": pid})
                    close(o, "REFUNDED", now, "money taken but seat gone: refunded")
            elif st == "PENDING":
                return 0  # bank not settled yet
            elif st in ("DECLINED", "NOT_FOUND"):
                close(o, "RELEASED", now, "no money was taken: order released")
            elif st == "REFUNDED":
                close(o, "REFUNDED", now, "already refunded")


        def handler(event, context):
            now = int(time.time())
            k = event.get("orderId")  # set by the recheck workflow
            pending = [orders.get_item(Key={"orderId": k}).get("Item")] if k else \
                orders.scan(FilterExpression=Attr("status").eq("PAYMENT_UNKNOWN"))["Items"]
            pending = [o for o in pending if o and o["status"] == "PAYMENT_UNKNOWN"]
            done = 0
            for o in pending:
                try:
                    done += resolve(o, now) != 0
                except Exception as e:  # after MAX_ATTEMPTS ask a human
                    n = int(o.get("attempts", 0)) + 1
                    stop = n >= MAX_ATTEMPTS
                    orders.update_item(Key={"orderId": o["orderId"]}, UpdateExpression="SET attempts = :n, #s = :s",
                                       ExpressionAttributeNames={"#s": "status"},
                                       ExpressionAttributeValues={":n": n, ":s": "NEEDS_REVIEW" if stop else o["status"]})
                    log(o["orderId"], "RETRY", "attempt %d failed: %s" % (n, e))
                    if stop:
                        sqs.send_message(QueueUrl=os.environ["DLQ_URL"], MessageBody=json.dumps(o, default=str))
            return {"checked": len(pending), "resolved": done, "open": len(pending) - done}

  # ------------------------------------------------------ ledger + batch runner
  LedgerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-ledger
      Handler: index.handler
      Timeout: 60
      # Public read-only totals and timelines. Reset is blocked when called through the URL.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET']
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      InlineCode: |
        import json, os, time, boto3
        from boto3.dynamodb.conditions import Key

        ddb = boto3.resource("dynamodb")
        T = {n: ddb.Table(os.environ[n.upper() + "_TABLE"]) for n in ("payments", "bookings", "seats", "events", "orders")}
        KEYS = {"payments": ["paymentId"], "bookings": ["bookingId"], "seats": ["eventId", "seatId"],
                "events": ["txnId", "ts"], "orders": ["orderId"]}
        PREFIX = {"NAIVE": "txn-", "SAGA": "sg-"}


        def scan(t):
            out, kw = [], {}
            while True:
                r = t.scan(**kw)
                out += r["Items"]
                if "LastEvaluatedKey" not in r:
                    return out
                kw["ExclusiveStartKey"] = r["LastEvaluatedKey"]


        def totals(flow):
            keep = lambda txn: flow == "ALL" or txn.startswith(PREFIX[flow])
            pays = [p for p in scan(T["payments"]) if keep(p["txnId"])]
            books = [b for b in scan(T["bookings"]) if keep(b["txnId"])]
            ords = [o for o in scan(T["orders"]) if keep(o["orderId"])]
            captured = {}
            for p in pays:
                if p["status"] == "CAPTURED":
                    captured.setdefault(p["txnId"], []).append(p)
            booked = {b["txnId"] for b in books}
            secs = [float(o["resolveSecs"]) for o in ords if "resolveSecs" in o]
            out = {
                "flow": flow,
                "payments": len(pays),
                "debitedRupees": sum(int(p["amount"]) for ps in captured.values() for p in ps),
                "ticketsIssued": len(books),
                "orphanedPayments": sum(1 for t in captured if t not in booked),
                "duplicateCharges": sum(len(ps) - 1 for ps in captured.values()),
                "refunded": sum(1 for p in pays if p["status"] == "REFUNDED"),
                "pendingReconcile": sum(1 for o in ords if o["status"] == "PAYMENT_UNKNOWN"),
                "needsReview": sum(1 for o in ords if o["status"] == "NEEDS_REVIEW"),
                "avgResolveSecs": round(sum(secs) / len(secs), 1) if secs else None,
                "maxResolveSecs": max(secs) if secs else None,
                "bankStatusCalls": sum(int(p.get("statusChecks", 0)) for p in pays),
                "paymentsChecked": sum(1 for p in pays if p.get("statusChecks")),
                "reconcilerMode": os.environ.get("RECON_MODE", "SCAN"),
            }
            if flow in PREFIX:  # CloudWatch Embedded Metric Format: becomes dashboard metrics for free
                m = ("OrphanedPayments", "DuplicateCharges", "PendingReconcile")
                print(json.dumps({"_aws": {"Timestamp": int(time.time() * 1000), "CloudWatchMetrics": [
                    {"Namespace": "Tatkal", "Dimensions": [["Flow"]], "Metrics": [{"Name": n, "Unit": "Count"} for n in m]}]},
                    "Flow": flow, "OrphanedPayments": out["orphanedPayments"],
                    "DuplicateCharges": out["duplicateCharges"], "PendingReconcile": out["pendingReconcile"]}))
            return out


        def handler(event, context):
            """{} / ?flow=NAIVE|SAGA -> totals. ?events=<txnId> -> step timeline.
            {"action":"reset"} -> empty all tables (console tests and the batch runner only, never the public URL)."""
            via_url = "requestContext" in event
            if via_url:
                if event.get("rawPath", "/") != "/":
                    return {"statusCode": 404, "body": ""}
                event = event.get("queryStringParameters") or {}
            if not via_url and event.get("action") == "reset":
                for name, keys in KEYS.items():
                    with T[name].batch_writer() as b:
                        for it in scan(T[name]):
                            b.delete_item(Key={k: it[k] for k in keys})
                return {"reset": True}
            if event.get("events"):
                rows = T["events"].query(KeyConditionExpression=Key("txnId").eq(event["events"]))["Items"]
                out = [{k: r.get(k) for k in ("ts", "flow", "step", "message")} for r in rows]
            else:
                out = totals(str(event.get("flow", "ALL")).upper())
            if not via_url:
                return out
            return {"statusCode": 200, "headers": {"Content-Type": "application/json"}, "body": json.dumps(out)}

  BatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-batch
      Handler: index.handler
      Timeout: 300
      # Public URL. Try: <url>?n=200&failPct=30
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET']
      Environment:
        Variables:
          NAIVE_FN: !Ref NaiveFunction
          LEDGER_FN: !Ref LedgerFunction
          EXPRESS_SM: !Ref SagaExpressMachine
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref NaiveFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref LedgerFunction
        - Statement:
            - Effect: Allow
              Action: states:StartSyncExecution
              Resource: !Ref SagaExpressMachine
      InlineCode: |
        import json, os, random, time, uuid, boto3
        from concurrent.futures import ThreadPoolExecutor

        lam = boto3.client("lambda")
        sfn = boto3.client("stepfunctions")
        FAILS = ["TIMEOUT_BUT_CHARGED", "BOOKING_FAILS_AFTER_PAY", "DUPLICATE_CLICK", "HOLD_EXPIRES_DURING_PAYMENT"]


        def call(fn, payload):
            for i in range(6):  # new accounts have low concurrency limits: back off and retry on throttling
                try:
                    r = lam.invoke(FunctionName=fn, Payload=json.dumps(payload))
                    return json.loads(r["Payload"].read())
                except lam.exceptions.TooManyRequestsException:
                    time.sleep(0.5 * 2 ** i)
            raise RuntimeError("throttled")


        def run_naive(i, mode):
            call(os.environ["NAIVE_FN"], {"txnId": "txn-b%03d" % i, "eventId": "NAIVE-SHOW", "seatId": "B%03d" % i, "mode": mode})


        def saga_once(inp):
            for k in range(6):
                r = sfn.start_sync_execution(stateMachineArn=os.environ["EXPRESS_SM"], input=json.dumps(inp))
                if r["status"] != "FAILED" or r.get("error") == "NeedsManualReview":
                    return r
                time.sleep(0.5 * 2 ** k)


        def run_saga(i, mode):
            inp = {"orderKey": "sg-b%03d" % i, "eventId": "SAGA-SHOW", "seatId": "B%03d" % i, "mode": mode}
            with ThreadPoolExecutor(2 if mode == "DUPLICATE_CLICK" else 1) as ex:  # a double click = two executions
                list(ex.map(lambda _: saga_once(inp), range(2 if mode == "DUPLICATE_CLICK" else 1)))


        def handler(event, context):
            """Runs the SAME N scenarios through the naive flow and then the saga, and returns both ledgers."""
            via_url = "requestContext" in event
            if via_url:
                if event.get("rawPath", "/") != "/":
                    return {"statusCode": 404, "body": ""}
                event = event.get("queryStringParameters") or {}
            n = max(1, min(int(event.get("n", 200)), 300))
            pct = max(0, min(int(event.get("failPct", 30)), 100))
            rnd = random.Random(42)  # fixed seed: both flows and every rerun get identical scenarios
            modes = []
            for _ in range(n):
                x = rnd.random() * 100
                modes.append(rnd.choice(FAILS) if x < pct else ("DECLINE" if x < pct + 5 else "SUCCESS"))
            if str(event.get("reset", "1")) != "0":
                call(os.environ["LEDGER_FN"], {"action": "reset"})
            t0 = time.time()
            with ThreadPoolExecutor(3) as ex:
                list(ex.map(lambda a: run_naive(*a), enumerate(modes)))
            t1 = time.time()
            with ThreadPoolExecutor(3) as ex:
                list(ex.map(lambda a: run_saga(*a), enumerate(modes)))
            t2 = time.time()
            out = {"n": n, "failPct": pct,
                   "scenarios": {m: modes.count(m) for m in sorted(set(modes))},
                   "naive": call(os.environ["LEDGER_FN"], {"flow": "NAIVE"}),
                   "saga": call(os.environ["LEDGER_FN"], {"flow": "SAGA"}),
                   "seconds": {"naive": round(t1 - t0, 1), "saga": round(t2 - t1, 1)},
                   "note": "Saga orders with pendingReconcile > 0 are payments whose result was unknown; "
                           "the reconciler (every minute) resolves them. Re-open the ledger a minute later."}
            if not via_url:
                return out
            return {"statusCode": 200, "headers": {"Content-Type": "application/json"}, "body": json.dumps(out)}

  # First Lambda from Session 0: writes one row to the Events table.
  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tatkal-ping
      Handler: index.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
      Events:
        PingApi:
          Type: HttpApi
          Properties:
            Path: /ping
            Method: GET
      InlineCode: |
        import json, os, uuid, datetime
        import boto3

        table = boto3.resource("dynamodb").Table(os.environ["EVENTS_TABLE"])

        def handler(event, context):
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            item = {
                "txnId": "ping-" + uuid.uuid4().hex[:8],
                "ts": now,
                "step": "PING",
                "message": "Lambda reached DynamoDB",
            }
            table.put_item(Item=item)
            return {
                "statusCode": 200,
                "headers": {"Content-Type": "application/json"},
                "body": json.dumps({"ok": True, "wrote": item}),
            }

  # ----------------------------------------------------- alarms and dashboard
  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tatkal-dlq-not-empty
      AlarmDescription: An order needs manual review (it failed after all retries)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SagaFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tatkal-saga-failed
      AlarmDescription: A saga execution ended in NeedsManualReview
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref SagaExpressMachine
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: tatkal
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Orphaned payments (paid, no ticket) by flow", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
            "metrics": [["Tatkal", "OrphanedPayments", "Flow", "NAIVE"], ["Tatkal", "OrphanedPayments", "Flow", "SAGA"]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Duplicate charges by flow", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
            "metrics": [["Tatkal", "DuplicateCharges", "Flow", "NAIVE"], ["Tatkal", "DuplicateCharges", "Flow", "SAGA"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Saga executions (Express)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
            "metrics": [["AWS/States", "ExecutionsStarted", "StateMachineArn", "${SagaExpressMachine}"], [".", "ExecutionsSucceeded", ".", "."], [".", "ExecutionsFailed", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Lambda invocations and errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
            "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "tatkal-naive"], [".", ".", ".", "tatkal-saga-pay"], [".", ".", ".", "tatkal-reconciler"], [".", "Errors", ".", "tatkal-gateway"], [".", ".", ".", "tatkal-saga-confirm"]]}},
          {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
            "title": "Dead-letter queue: orders waiting for a human", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
            "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "tatkal-dlq"]]}},
          {"type": "alarm", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
            "title": "Alarms", "alarms": ["${DlqAlarm.Arn}", "${SagaFailedAlarm.Arn}"]}}
        ]}

Outputs:
  NaiveUrl:
    Description: Naive flow in a browser, e.g. add ?mode=TIMEOUT_BUT_CHARGED
    Value: !GetAtt NaiveFunctionUrl.FunctionUrl
  SagaUrl:
    Description: Saga flow in a browser, e.g. add ?mode=TIMEOUT_BUT_CHARGED
    Value: !GetAtt SagaStartFunctionUrl.FunctionUrl
  LedgerUrl:
    Description: Totals (add ?flow=NAIVE or ?flow=SAGA) or a timeline (add ?events=TXN_ID)
    Value: !GetAtt LedgerFunctionUrl.FunctionUrl
  BatchUrl:
    Description: Runs the same N scenarios through both flows (add ?n=200&failPct=30). Takes about 2 minutes.
    Value: !GetAtt BatchFunctionUrl.FunctionUrl
  DlqUrl:
    Description: Dead-letter queue URL
    Value: !Ref DeadLetterQueue
  PingUrl:
    Description: Public test URL (may show "Healthy Connection" while the account is being verified)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/ping"
